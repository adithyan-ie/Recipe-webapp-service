name: MAIN — Post-release Audit
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit-build:
    name: SAST + Build + SemVer Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Maven build (audit)
        run: mvn -B package -DskipTests

      - name: Create audit tag
        run: |
          TAG="audit-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          echo "Would tag release: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
