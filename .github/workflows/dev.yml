name: Dev - Test, Build & Deploy (Container)

on:
  push:
    branches: [ development ]
  workflow_run:
    workflows: ["terraform Infra"]   # must match the workflow name in terraform.yml
    types:
      - completed

jobs:

  run-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run unit tests
        run: mvn clean test

      - name: Run verify
        run: mvn verify -DskipTests

      - name: Upload JUnit Reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/*.xml

  docker-build-push:
    needs: run-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/recipe-backend:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & Push
        run: |
          docker build -t ${{ steps.image.outputs.image }} .
          docker push ${{ steps.image.outputs.image }}

  deploy-dev:
    needs: docker-build-push
    runs-on: ubuntu-latest

    environment:
        name: dev

    permissions:
        id-token: write
        contents: read

    steps:

      - uses: actions/download-artifact@v4
        with:
          name: tf-output

      - name: Read slot flag
        id: tf
        run: |
          source tf-output.txt
          echo "use_slots=$use_slots" >> $GITHUB_OUTPUT

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to slot
        if: steps.tf.outputs.use_slots == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: development
          images: ${{ needs.docker-build-push.outputs.image }}

      # Deploy to main app (B1)
      - name: Deploy to main app
        if: steps.tf.outputs.use_slots != 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ needs.docker-build-push.outputs.image }}


      - name: Restart DEV slot
        if: steps.tf.outputs.use_slots == 'true'
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --slot dev

      - name: Smoke test DEV
        if: steps.tf.outputs.use_slots == 'true'
        run: |
          curl -f https://${{ secrets.AZURE_WEBAPP_NAME }}-dev.azurewebsites.net/actuator/health

      - name: Restart main app
        if: steps.tf.outputs.use_slots != 'true'
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}