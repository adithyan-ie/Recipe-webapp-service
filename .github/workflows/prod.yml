name: prod - Build & Deploy (Container)

on:
  push:
    branches: [ release ]
  workflow_run:
    workflows: ["terraform Infra"]   # must match the workflow name in terraform.yml
    types:
      - completed

jobs:
  code-analysis:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for Sonar blame info

      # 2️⃣ Set up JDK 17
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
        id: java

      # 3️⃣ Cache Maven dependencies
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 7️⃣ SonarCloud scan
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey=adithyan-ie_Recipe-webapp-service \
            -Dsonar.organization=adithyan-ie \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.binaries=target/classes \
            -Dsonar.sources=src/main/java \
            -Dsonar.projectName="Recipe-webapp-service"

      - name: Build project
        run: mvn -B clean install -DskipTests

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "recipe-backend"
          path: "."
          format: "HTML"
          out: "dependency-check-report"
        env:
          JAVA_HOME: /opt/jdk

      - name: Upload depedency analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  run-test:
    needs: code-analysis
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run unit tests
        run: mvn clean test

      - name: Run verify
        run: mvn verify -DskipTests

      - name: Upload JUnit Reports
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/*.xml

  docker-build-push:
    needs: run-test
    runs-on: ubuntu-latest
    environment:
      name: production
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image
        run: |
          IMAGE=${{ secrets.ACR_LOGIN_SERVER }}/recipe-backend-prod:${{ github.sha }}
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build & Push
        run: |
          docker build -t ${{ steps.image.outputs.image }} .
          docker push ${{ steps.image.outputs.image }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          output: trivy-report.txt
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Save Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt  

  deploy-prod:
    needs: docker-build-push
    runs-on: ubuntu-latest

    permissions:
        id-token: write
        contents: read

    environment:
      name: production

    steps:

      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ─────────────────────────────────────
      # Terraform read-only (state source)
      # ─────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (infra state only)
        working-directory: infra
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=sttfstaterecipewebapp" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=prod/recipe-webapp.tfstate"

      - name: Read use_slots from Terraform
        id: tf
        working-directory: infra
        run: |
          echo "use_slots=$(terraform output -raw use_slots)" >> $GITHUB_OUTPUT

      - name: Enable managed identity for ACR pull
        run: |
          az webapp config set \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'

      - name: Deploy to main app
        if: steps.tf.outputs.use_slots != 'true'
        run: |
           az webapp config set \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --linux-fx-version "DOCKER|${{ secrets.ACR_LOGIN_SERVER }}/recipe-backend-prod:${{ github.sha }}"

      - name: Restart main app
        if: steps.tf.outputs.use_slots != 'true'
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}


      - name: Deploy to slot
        if: steps.tf.outputs.use_slots == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PROD }}
          slot-name: staging
          images: ${{ secrets.ACR_LOGIN_SERVER }}/recipe-backend-prod:${{ github.sha }}

      - name: Smoke test Stage
        if: steps.tf.outputs.use_slots == 'true'
        run: |
          curl -f https://${{ secrets.AZURE_WEBAPP_NAME_PROD }}-staging.azurewebsites.net/

      - name: Swap staging to production
        if: steps.tf.outputs.use_slots == 'true'
        run: |
          az webapp deployment slot swap \
            --name ${{ secrets.AZURE_WEBAPP_NAME_PROD }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production

     